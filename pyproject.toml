[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditable-portfolio-lab"
version = "0.1.0"
description = "Auditable portfolio research with provenance-aware data and reproducible benchmarks."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "requests>=2.31",
]

[project.scripts]
pcopt = "pcopt.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.13",
]
viz = [
  "matplotlib>=3.9",
]

[tool.setuptools.packages.find]
include = ["pcopt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
