[project]
name = "portfoliocharts-optimizer"
version = "0.1.0"
description = "Portfolio Charts-style annual-return metrics and genetic portfolio optimization."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
